
  <div class="card section-card" id="vendorSection">
    <div class="section-header-row">
      <div style="flex:1 1 auto">
        <div class="sectionhead vendor-header-row">
          <div>
            <strong><span class="section-title">Ordering</span></strong>
            <div class="small muted">Review active orders by vendor, adjust final quantities, and place orders.</div>
          </div>
          <div class="vendor-summary" id="vendorSummary">Current list: 0 codes | 0 bottles | 0 edited</div>
        </div>
      </div>
      <button id="vendorToggle" class="section-toggle" title="Collapse or expand Ordering">−</button>
    </div>
    <div class="section-body vendor-section-inner" id="vendorSectionBody">
      <div class="vendor-controls-top">
        <div class="tabs" id="vendorTabs"></div>
        <div class="toolbar-group vendor-export-wrap">
          <button id="vendorExportMenuBtn" class="primary">Export ▾</button>
          <div id="vendorExportMenu" class="menu hidden">
            <button id="exportVendorCsvBtn">Export CSV</button>
            <button id="exportVendorXlsxBtn">Export XLSX</button>
            <button id="exportVendorJpgBtn">Export JPG</button>
            <button id="exportVendorLoopBtn">Export LOOP (Upload Ready)</button>
          </div>
        </div>
      </div>
      <div class="vendor-controls-bottom">
        <button id="quickOrderBtn" class="success ui-control">Quick Order</button>
        <input id="vendorSearchInput" placeholder="Filter current order" />
      </div>
      <div id="smartSuggestionsSummary" class="notice hidden"></div>
      <div class="vendor-table-shell">
        <div class="tablewrap" id="vendorExportArea">
        <table>
          <colgroup>
            <col class="vendor-col">
            <col class="badge-col">
            <col class="item-col">
            <col class="onhand-col">
            <col class="suggested-col">
            <col class="toorder-col-width">
            <col class="final-col">
          </colgroup>
          <thead><tr><th>VENDOR</th><th class="badgehead"></th><th>ITEM</th><th>ON HAND</th><th>SUGGESTED</th><th class="toorder-head">TO ORDER</th><th>FINAL ORDER</th></tr></thead>
          <tbody id="vendorBody"></tbody>
        </table>
      </div>
      </div>
      <div class="vendor-placebar hidden" id="placeOrderBar">
        <div class="vendor-subtotal" id="vendorSubtotalBox">
          <div>
            <div class="label">Order Subtotal</div>
            <div class="amount" id="vendorSubtotalAmount">$0.00</div>
          </div>
        </div>
        <button id="placeOrderBtn" class="success">PLACE ORDER</button>
      </div>
    </div>
  </div>
