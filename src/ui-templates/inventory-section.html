  <div class="card section-card" id="inventorySection">
    <div class="section-header-row">
      <div style="flex:1 1 auto">
        <div class="sectionhead inventory-header-row">
          <div>
            <strong><span class="section-title">Inventory</span></strong>
            <div class="small muted">View, search, and edit all inventory items, counts, suggested levels, and prices.</div>
          </div>
        </div>
      </div>
      <button id="inventoryToggle" class="section-toggle" title="Collapse or expand Inventory">−</button>
    </div>
    <div class="section-body" id="inventorySectionBody">
      <div class="inventory-controls-top">
        <div class="tabs" id="inventoryVendorTabs"></div>
        <div class="inventory-tools">
          <button id="addInventoryItemBtn">Add New Item</button>
          <button id="scanInvoiceBtn" class="primary">Scan Price Invoice</button>
        </div>
      </div>
      <div class="inventory-controls-bottom">
        <input id="searchInput" placeholder="Filter current order" />
      </div>
      <select id="vendorFilter" class="hidden" aria-hidden="true">
        <option value="ALL">All Vendors</option>
        <option value="LOOP">LOOP</option>
        <option value="SOUTHERN">SOUTHERN</option>
        <option value="BREAKTHRU">BREAKTHRU</option>
        <option value="WINE MERCHANT">WINE MERCHANT</option>
        <option value="UNKNOWN">UNKNOWN</option>
      </select>
      <div class="tablewrap">
        <table>
          <thead><tr><th>CODE</th><th>ITEM</th><th>VENDOR</th><th>ON HAND</th><th>SUGGESTED</th><th>TO ORDER</th><th>VALUE</th><th>ACTIONS</th></tr></thead>
          <tbody id="inventoryBody"></tbody>
        </table>
      </div>
    </div>
  </div>
